name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MESON_VERSION: 1.7.2

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-15
            image: gcc:15-bookworm
            cc: gcc
            cxx: g++
            toolchain_args: ''
            extra_packages: ''
          - name: clang-21
            image: silkeh/clang:21-bookworm
            cc: clang
            cxx: clang++
            toolchain_args: -Dcpp_args=-stdlib=libc++ -Dcpp_link_args=-stdlib=libc++
            extra_packages: libc++-21-dev libc++abi-21-dev
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip ninja-build pkg-config cmake zstd \
            zlib1g-dev ${{ matrix.extra_packages }} \
            libsqlite3-dev libssl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install --break-system-packages --no-cache-dir "meson==${MESON_VERSION}"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Report toolchain
        run: |
          "$CXX" --version
          meson --version
          ninja --version
      - name: Configure
        run: meson setup buildDir --wrap-mode=nodownload ${{ matrix.toolchain_args }}
      - name: Build
        run: meson compile -C buildDir
      - name: Test
        run: meson test -C buildDir --print-errorlogs

  sanitize:
    name: sanitize (Clang 21, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: silkeh/clang:21-bookworm
    env:
      CC: clang
      CXX: clang++
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip ninja-build pkg-config cmake zstd \
            zlib1g-dev \
            libc++-21-dev libc++abi-21-dev \
            libsqlite3-dev libssl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install --break-system-packages --no-cache-dir "meson==${MESON_VERSION}"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: |
          meson setup buildDir-asan -Db_sanitize=address,undefined \
            -Dcpp_args=-stdlib=libc++ -Dcpp_link_args=-stdlib=libc++ \
            --wrap-mode=nodownload
      - name: Build
        run: meson compile -C buildDir-asan
      - name: Test
        run: meson test -C buildDir-asan --print-errorlogs

  sqlite-fallback:
    name: SQLite fallback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: gcc:15-bookworm
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip ninja-build pkg-config cmake zstd \
            zlib1g-dev \
            libssl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install --break-system-packages --no-cache-dir "meson==${MESON_VERSION}"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: meson setup buildDir-fallback --force-fallback-for=sqlite3
      - name: Build
        run: meson compile -C buildDir-fallback
      - name: Test resource workflow
        run: |
          meson test -C buildDir-fallback --print-errorlogs \
            resource nanres-cli portable-stage nanres-build-workflow \
            nandina-subproject-fixture font-resource application-resource

  physics:
    name: physics (Box2D enabled)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: gcc:15-bookworm
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-pip ninja-build pkg-config cmake zstd \
            zlib1g-dev \
            libsqlite3-dev libssl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev
          python3 -m pip install --break-system-packages --no-cache-dir "meson==${MESON_VERSION}"
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Configure
        run: meson setup buildDir-physics -Dphysics2d=enabled --wrap-mode=nodownload
      - name: Build
        run: meson compile -C buildDir-physics
      - name: Test physics
        run: meson test -C buildDir-physics physics2d --print-errorlogs
